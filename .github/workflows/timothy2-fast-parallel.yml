name: Timothy 2 Fast Parallel

on:
  push:
    branches:
      - main
    paths:
      - ".timothy2-fast/**"

permissions:
  contents: read

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install gdown "faster-whisper==1.2.1" "av<19"
      - run: mkdir -p work && gdown "1_gHGvzOER1E8WcUwn7UfrxwkhXE4autT" -O work/timothy2.mp4
      - run: python .github/scripts/timothy2_prepare.py
      - uses: actions/upload-artifact@v4
        with:
          name: timothy2-transcript-fast
          path: work/transcript.json
          retention-days: 1

  render:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        group:
          - 0
          - 1
          - 2
          - 3
          - 4
          - 5
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: python -m pip install gdown
      - uses: actions/download-artifact@v4
        with:
          name: timothy2-transcript-fast
          path: work
      - run: gdown "1_gHGvzOER1E8WcUwn7UfrxwkhXE4autT" -O work/timothy2.mp4
      - run: python .github/scripts/timothy2_render.py "${{ matrix.group }}"
      - uses: actions/upload-artifact@v4
        with:
          name: t2fast-group-${{ matrix.group }}
          path: work/out/*.mp4
          compression-level: 0
          retention-days: 1
