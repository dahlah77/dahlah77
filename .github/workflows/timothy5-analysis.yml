name: Timothy 5 Analyze First
on:
  pull_request:
    branches: [main]
    paths:
      - '.timothy5-analysis/**'
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Install media analysis tools
        run: |
          python -m pip install --upgrade pip
          pip install gdown "faster-whisper==1.2.1" "av<19" pillow
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Download original TIMOTHY 5
        run: |
          mkdir -p work/out
          gdown 1Yv_8FM-qnOnLq2KIG2bGbMMbmkoM0R0v -O work/source.mp4
          test $(stat -c %s work/source.mp4) -gt 300000000
          ffprobe -v error -show_entries format=duration,size:stream=codec_type,width,height,r_frame_rate -of json work/source.mp4 > work/out/metadata.json
          cat work/out/metadata.json
      - name: Full speech transcript and word timestamps
        run: |
          cat > work/transcribe.py <<'PY'
          from faster_whisper import WhisperModel
          import json
          m=WhisperModel("small",device="cpu",compute_type="int8")
          segments,info=m.transcribe(
            "work/source.mp4",
            language="id",
            beam_size=5,
            vad_filter=True,
            word_timestamps=True,
            initial_prompt="Timothy Ronald, bahasa Indonesia percakapan, uang, investasi, saham, Bitcoin, crypto, karier, ekonomi, bisnis.",
            condition_on_previous_text=True
          )
          data={"language":info.language,"language_probability":info.language_probability,"segments":[]}
          with open("work/out/transcript.txt","w",encoding="utf-8") as t:
            for i,s in enumerate(segments):
              line={"id":i,"start":s.start,"end":s.end,"text":s.text.strip(),"words":[{"start":w.start,"end":w.end,"word":w.word,"probability":w.probability} for w in (s.words or [])]}
              data["segments"].append(line)
              t.write(f"[{s.start:08.2f} - {s.end:08.2f}] {s.text.strip()}\n")
              if i%30==0: print(f"transcribed: {s.end:.1f}s, segments={i+1}",flush=True)
          json.dump(data,open("work/out/transcript.json","w",encoding="utf-8"),ensure_ascii=False)
          print("COMPLETE",len(data["segments"]))
          PY
          python -u work/transcribe.py
      - name: Contact sheet for actual video visual review
        run: |
          python - <<'PY'
          import json,subprocess,os,math
          from PIL import Image,ImageOps,ImageDraw
          m=json.load(open('work/out/metadata.json'))
          dur=float(m['format']['duration'])
          n=36
          canvas=Image.new('RGB',(480*6,300*6),(15,15,15))
          for i in range(n):
            t=dur*(i+.5)/n
            frame=f'/tmp/frame{i}.jpg'
            subprocess.run(['ffmpeg','-y','-v','error','-ss',str(t),'-i','work/source.mp4','-frames:v','1','-vf','scale=480:270','-q:v','5',frame],check=True)
            im=Image.open(frame); x=(i%6)*480; y=(i//6)*300
            canvas.paste(im,(x,y))
            ImageDraw.Draw(canvas).text((x+8,y+274),f'{int(t//60):02d}:{int(t%60):02d}',fill='white')
            os.remove(frame)
          canvas.save('work/out/contact-sheet.jpg',quality=82)
          print('contact sheet of',n,'frames created')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: timothy5-analysis
          path: work/out/
          compression-level: 6
          retention-days: 3
