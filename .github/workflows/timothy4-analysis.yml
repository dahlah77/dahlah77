name: Timothy 4 Analysis
on:
  pull_request:
    branches: [main]
    paths:
      - '.timothy4-analysis/**'
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - name: Install transcription
        run: |
          python -m pip install --upgrade pip
          pip install gdown "faster-whisper==1.2.1" "av<19"
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Download Timothy 4
        run: |
          mkdir -p work/output
          gdown "1SRW1MX-FaLEDcRtDBWfUJVijCMEu6pNR" -O work/source.mp4
          test -s work/source.mp4
          ffprobe -v error -show_entries format=duration:stream=width,height,avg_frame_rate -of json work/source.mp4 | tee work/output/metadata.json
      - name: Accurate word timestamps
        run: |
          cat > work/transcribe.py <<'PY'
          from faster_whisper import WhisperModel
          import json
          model=WhisperModel("small",device="cpu",compute_type="int8")
          segments,info=model.transcribe("work/source.mp4",language="id",beam_size=5,vad_filter=True,word_timestamps=True,condition_on_previous_text=True,initial_prompt="Timothy Ronald berbicara bahasa Indonesia, finansial, Bitcoin, investasi, ekonomi, mindset.")
          data={"language":info.language,"segments":[]}
          with open("work/output/transcript.txt","w",encoding="utf-8") as f:
            for i,s in enumerate(segments):
              seg={"id":i,"start":round(s.start,3),"end":round(s.end,3),"text":s.text.strip(),"words":[{"start":round(w.start,3),"end":round(w.end,3),"word":w.word,"probability":round(w.probability,3)} for w in (s.words or [])]}
              data["segments"].append(seg)
              f.write(f"[{s.start:.2f} - {s.end:.2f}] {s.text.strip()}\n")
          with open("work/output/transcript.json","w",encoding="utf-8") as f:json.dump(data,f,ensure_ascii=False)
          PY
          python work/transcribe.py
      - name: Still image timeline
        run: |
          ffmpeg -y -loglevel error -i work/source.mp4 -vf "fps=1/90,scale=480:-2,tile=4x4" -frames:v 4 work/output/contact-%02d.jpg || true
      - uses: actions/upload-artifact@v4
        with:
          name: timothy4-content-analysis
          path: work/output/
          retention-days: 5
