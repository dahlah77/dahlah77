name: Timothy 3 Analysis

on:
  pull_request:
    branches: [main]
    paths:
      - '.timothy3-analysis/**'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install gdown "faster-whisper==1.2.1" "av<19"
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Download source
        run: |
          mkdir -p work/out
          gdown "1FYGqHgVclstPK2DHM86KqeTVlW1MNNFf" -O work/timothy3.mp4
          ffprobe -v error -show_entries format=duration:stream=width,height,r_frame_rate -of json work/timothy3.mp4 > work/out/metadata.json

      - name: Transcribe Indonesian word-level
        run: |
          cat > work/transcribe.py <<'PY'
          from faster_whisper import WhisperModel
          import json
          prompt = """Bahasa Indonesia santai. Timothy Ronald. Topik bisnis, uang, investasi, kerja, skill, karier, kekayaan, anak muda, keputusan hidup."""
          model = WhisperModel("small", device="cpu", compute_type="int8")
          segments, info = model.transcribe(
              "work/timothy3.mp4",
              language="id",
              beam_size=5,
              vad_filter=True,
              word_timestamps=True,
              initial_prompt=prompt,
              condition_on_previous_text=True
          )
          data={"language":info.language,"segments":[]}
          for i,s in enumerate(segments,1):
              data["segments"].append({
                  "id":i,"start":s.start,"end":s.end,"text":s.text.strip(),
                  "words":[{"start":w.start,"end":w.end,"word":w.word,"probability":w.probability} for w in (s.words or [])]
              })
          json.dump(data,open("work/out/transcript.json","w",encoding="utf-8"),ensure_ascii=False,indent=2)
          with open("work/out/transcript.txt","w",encoding="utf-8") as f:
              for s in data["segments"]:
                  f.write(f"[{s['start']:.2f} - {s['end']:.2f}] {s['text']}\n")
          PY
          python work/transcribe.py

      - name: Make lightweight review proxy
        run: |
          ffmpeg -y -hide_banner -loglevel warning -i work/timothy3.mp4             -vf "scale=640:-2" -c:v libx264 -preset veryfast -crf 30             -c:a aac -b:a 80k -movflags +faststart work/out/proxy.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: timothy3-analysis
          path: work/out/
          compression-level: 0
          retention-days: 1
