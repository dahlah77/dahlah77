name: Timothy 2 Worker

on:
  pull_request:
    branches: [main]
    paths:
      - '.timothy2/**'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install gdown faster-whisper "av<19"

      - name: Download source
        run: |
          mkdir -p work/out
          gdown "1_gHGvzOER1E8WcUwn7UfrxwkhXE4autT" -O work/timothy2.mp4
          ls -lh work/timothy2.mp4
          ffprobe -v error -show_format -show_streams work/timothy2.mp4 > work/out/meta.txt

      - name: Upload analysis package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timothy2-analysis
          path: work/out/
          compression-level: 6
          retention-days: 1
