name: Timothy 3 Remotion Final

on:
  pull_request:
    branches: [main]
    paths:
      - '.timothy3-remotion/**'

permissions:
  contents: read
  actions: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        group: [0,1,2,3,4]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          pip install gdown

      - name: Download source and audited transcript
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p remotion/public remotion/src remotion/out analysis
          gdown "1FYGqHgVclstPK2DHM86KqeTVlW1MNNFf" -O remotion/public/timothy3.mp4
          gh api /repos/${GITHUB_REPOSITORY}/actions/artifacts/11468006354/zip > analysis.zip
          unzip -o analysis.zip transcript.json -d analysis
          cp analysis/transcript.json remotion/src/transcript.json

      - name: Create Remotion project
        working-directory: remotion
        run: |
          cat > package.json <<'EOF'
          {
            "private": true,
            "type": "module",
            "dependencies": {
              "remotion": "4.0.530",
              "@remotion/cli": "4.0.530",
              "@remotion/media": "4.0.530",
              "react": "19.1.0",
              "react-dom": "19.1.0"
            }
          }
          EOF
          npm install --no-audit --no-fund

          cat > src/clips.js <<'EOF'
          export const clips = [
            {id:1,start:0.00,end:77.18,title:"BITCOIN 83K? BERHENTI NEBAK HARGA BESOK",file:"T3_01_BTC_83K_JANGAN_NEBAK_HARGA.mp4"},
            {id:2,start:77.18,end:118.86,title:"DEMAND BITCOIN SUDAH BERUBAH",file:"T3_02_ADOPSI_INSTITUSI_UBAH_DEMAND.mp4"},
            {id:3,start:118.86,end:155.50,title:"SWING BITCOIN DITENTUKAN LIKUIDITAS MAKRO",file:"T3_03_LIKUIDITAS_MAKRO_TENTUKAN_SWING.mp4"},
            {id:4,start:155.50,end:211.82,title:"SHORT SQUEEZE: KENAPA HARGA BISA MELEDAK",file:"T3_04_SHORT_SQUEEZE_FORCED_FLOW.mp4"},
            {id:5,start:211.82,end:268.04,title:"ETF MENGUBAH AKSES UANG BESAR KE BITCOIN",file:"T3_05_ETF_UBAH_AKSES_INSTITUSI.mp4"},
            {id:6,start:268.04,end:313.04,title:"KENAPA MARKET CEPAT JADI EFISIEN",file:"T3_06_MARKET_EFISIEN_ARBITRASE.mp4"},
            {id:7,start:313.04,end:363.68,title:"CRYPTO BUKAN PLANET SENDIRI",file:"T3_07_TREASURY_CRYPTO_BUKAN_PLANET_SENDIRI.mp4"},
            {id:8,start:363.68,end:434.06,title:"2 FRAMEWORK TIMOTHY BUAT ANALISA BITCOIN",file:"T3_08_LIQUIDITY_CLOCK_ADOPTION_CLOCK.mp4"},
            {id:9,start:448.48,end:484.98,title:"RETAIL JANGAN SOK TIMING TOP & BOTTOM",file:"T3_09_RETAIL_JANGAN_SOK_TIMING.mp4"},
            {id:10,start:484.98,end:528.78,title:"TARUH UANG YANG SIAP HILANG",file:"T3_10_POSITION_SIZING_SIAP_HILANG.mp4"},
            {id:11,start:528.78,end:576.92,title:"DCA UNTUK MEMBUNUH EMOSI",file:"T3_11_DCA_ELIMINASI_EMOSI.mp4"},
            {id:12,start:576.92,end:622.80,title:"HARGA TURUN BUKAN BERARTI TESIS BERUBAH",file:"T3_12_HARGA_VS_TESIS_SURVIVAL.mp4"},
            {id:13,start:622.80,end:695.74,title:"42 BULAN: DARI 100 JUTA KE PORTOFOLIO MILIARAN",file:"T3_13_BUKTI_EKSEKUSI_PORTOFOLIO.mp4"}
          ];
          EOF

          cat > src/TimothyClip.jsx <<'EOF'
          import React, {useMemo} from "react";
          import {AbsoluteFill, interpolate, spring, staticFile, useCurrentFrame, useVideoConfig} from "remotion";
          import {Video} from "@remotion/media";
          import transcript from "./transcript.json";
          import {clips} from "./clips.js";

          const replacements = [
            [/\bblack rock\b/gi,"BlackRock"],
            [/\bjp morgan\b/gi,"JPMorgan"],
            [/\bgoldman sax\b/gi,"Goldman Sachs"],
            [/\bfranklin temple\b/gi,"Franklin Templeton"],
            [/\bfederal reserve\b/gi,"Federal Reserve"],
            [/\bliquiditas\b/gi,"likuiditas"],
            [/\bdofish\b/gi,"dovish"],
            [/\bforge flow\b/gi,"forced flow"],
            [/\bshorting\b/gi,"shorting"],
            [/\bshort squeeze\b/gi,"short squeeze"],
            [/\bdollar cost average\b/gi,"dollar cost averaging"],
            [/\bus treasury\b/gi,"US Treasury"],
            [/\bpublic dan private key\b/gi,"public & private key"],
            [/\bcold wallet\b/gi,"cold wallet"],
            [/\binteractive broker\b/gi,"Interactive Brokers"],
            [/\bbitcoin\b/gi,"Bitcoin"]
          ];

          const cleanWord = (word) => {
            let s = word;
            for (const [a,b] of replacements) s=s.replace(a,b);
            return s;
          };

          const words = transcript.segments.flatMap((s)=>
            (s.words || [])
              .filter((w)=>w.start != null && w.end != null)
              .map((w)=>({...w,word:cleanWord((w.word || "").trim())}))
          );

          const keywords = new Set([
            "bitcoin","likuiditas","makro","institusi","blackrock","jpmorgan","goldman","sachs","etf",
            "short","squeeze","forced","flow","treasury","federal","reserve","arbitrase","dca",
            "tesis","survival","emosi","investor","adopsi","demand","rate","rates","risiko","portfolio",
            "portofolio","miliar","juta","100"
          ]);

          const normalize=(s)=>s.toLowerCase().replace(/[^0-9a-zà-ÿ-]/gi,"");

          const buildPages=(clip)=>{
            const ws=words.filter((w)=>w.start>=clip.start-0.08 && w.end<=clip.end+0.08);
            const pages=[]; let cur=[];
            for(const w of ws){
              if(cur.length===0){cur=[w];continue;}
              const gap=w.start-cur[cur.length-1].end;
              const dur=w.end-cur[0].start;
              const punct=/[.!?]$/.test(cur[cur.length-1].word);
              if(cur.length>=5 || gap>0.48 || dur>1.9 || (punct && cur.length>=3)){
                pages.push(cur); cur=[w];
              }else cur.push(w);
            }
            if(cur.length) pages.push(cur);
            return pages;
          };

          export const TimothyClip=({clipId})=>{
            const clip=clips.find((c)=>c.id===clipId)||clips[0];
            const frame=useCurrentFrame();
            const {fps,durationInFrames}=useVideoConfig();
            const abs=clip.start+frame/fps;
            const pages=useMemo(()=>buildPages(clip),[clip.id]);
            const page=pages.find((p)=>abs>=p[0].start-0.04 && abs<=p[p.length-1].end+0.12);
            const titleIn=spring({fps,frame,config:{damping:18,stiffness:190,mass:.8}});
            const titleOpacity=interpolate(frame,[0,6,48,62],[0,1,1,0],{extrapolateLeft:"clamp",extrapolateRight:"clamp"});
            const zoom=1.016+Math.sin(frame/52)*0.007;
            const progress=Math.min(1,Math.max(0,frame/Math.max(1,durationInFrames-1)));

            return (
              <AbsoluteFill style={{backgroundColor:"#050505",fontFamily:"DejaVu Sans, Arial, sans-serif",overflow:"hidden"}}>
                <Video
                  src={staticFile("timothy3.mp4")}
                  trimBefore={Math.round(clip.start*fps)}
                  trimAfter={Math.round(clip.end*fps)}
                  durationInFrames={Math.ceil((clip.end-clip.start)*fps)}
                  style={{
                    position:"absolute",width:"100%",height:"100%",objectFit:"cover",
                    objectPosition:"40% 50%",transform:`scale(${zoom})`,
                    filter:"contrast(1.04) saturate(1.03)"
                  }}
                />
                <AbsoluteFill style={{background:"linear-gradient(180deg,rgba(0,0,0,.18) 0%,rgba(0,0,0,0) 32%,rgba(0,0,0,0) 58%,rgba(0,0,0,.48) 100%)"}}/>

                <div style={{position:"absolute",top:0,left:0,height:5,width:(progress*100)+"%",background:"#FFD400"}}/>

                <div style={{
                  position:"absolute",top:62,left:42,right:42,display:"flex",justifyContent:"center",
                  opacity:titleOpacity,transform:`scale(${0.94+titleIn*0.06})`
                }}>
                  <div style={{
                    maxWidth:620,padding:"15px 20px",borderRadius:18,background:"rgba(0,0,0,.72)",
                    border:"1px solid rgba(255,255,255,.13)",boxShadow:"0 10px 28px rgba(0,0,0,.30)",
                    color:"#fff",fontWeight:950,fontSize:42,lineHeight:1.05,textAlign:"center",
                    textTransform:"uppercase",letterSpacing:-1
                  }}>{clip.title}</div>
                </div>

                {page ? <div style={{
                  position:"absolute",left:44,right:44,bottom:178,textAlign:"center",
                  fontSize:56,lineHeight:1.1,fontWeight:950,letterSpacing:-1.25,
                  textTransform:"uppercase",filter:"drop-shadow(0 4px 7px rgba(0,0,0,.8))"
                }}>
                  {page.map((w,i)=>{
                    const active=abs>=w.start && abs<=w.end+0.05;
                    const key=keywords.has(normalize(w.word));
                    return <span key={i} style={{
                      display:"inline-block",marginRight:11,
                      color:active?"#FFD400":(key?"#FFF0A3":"#FFFFFF"),
                      WebkitTextStroke:"2.5px rgba(0,0,0,.92)",
                      transform:active?"scale(1.07)":"scale(1)"
                    }}>{w.word}</span>
                  })}
                </div>:null}

                <div style={{
                  position:"absolute",right:28,bottom:70,padding:"7px 11px",borderRadius:10,
                  background:"rgba(0,0,0,.52)",color:"rgba(255,255,255,.75)",
                  fontSize:18,fontWeight:700,letterSpacing:.5
                }}>TIMOTHY RONALD</div>
              </AbsoluteFill>
            );
          };
          EOF

          cat > src/Root.jsx <<'EOF'
          import React from "react";
          import {Composition} from "remotion";
          import {TimothyClip} from "./TimothyClip.jsx";
          import {clips} from "./clips.js";

          export const RemotionRoot=()=>(
            <Composition
              id="Timothy3Clip"
              component={TimothyClip}
              width={720}
              height={1280}
              fps={24}
              durationInFrames={Math.ceil((clips[0].end-clips[0].start)*24)}
              defaultProps={{clipId:1}}
              calculateMetadata={({props})=>{
                const clip=clips.find((c)=>c.id===props.clipId)||clips[0];
                return {
                  durationInFrames:Math.ceil((clip.end-clip.start)*24),
                  defaultOutName:clip.file
                };
              }}
            />
          );
          EOF

          cat > src/index.jsx <<'EOF'
          import {registerRoot} from "remotion";
          import {RemotionRoot} from "./Root.jsx";
          registerRoot(RemotionRoot);
          EOF

          npx remotion browser ensure

      - name: Render assigned clips
        working-directory: remotion
        env:
          GROUP: ${{ matrix.group }}
        run: |
          python - <<'PY'
          import os, subprocess, json
          clips=[
            (1,"T3_01_BTC_83K_JANGAN_NEBAK_HARGA.mp4"),
            (2,"T3_02_ADOPSI_INSTITUSI_UBAH_DEMAND.mp4"),
            (3,"T3_03_LIKUIDITAS_MAKRO_TENTUKAN_SWING.mp4"),
            (4,"T3_04_SHORT_SQUEEZE_FORCED_FLOW.mp4"),
            (5,"T3_05_ETF_UBAH_AKSES_INSTITUSI.mp4"),
            (6,"T3_06_MARKET_EFISIEN_ARBITRASE.mp4"),
            (7,"T3_07_TREASURY_CRYPTO_BUKAN_PLANET_SENDIRI.mp4"),
            (8,"T3_08_LIQUIDITY_CLOCK_ADOPTION_CLOCK.mp4"),
            (9,"T3_09_RETAIL_JANGAN_SOK_TIMING.mp4"),
            (10,"T3_10_POSITION_SIZING_SIAP_HILANG.mp4"),
            (11,"T3_11_DCA_ELIMINASI_EMOSI.mp4"),
            (12,"T3_12_HARGA_VS_TESIS_SURVIVAL.mp4"),
            (13,"T3_13_BUKTI_EKSEKUSI_PORTOFOLIO.mp4")
          ]
          g=int(os.environ["GROUP"])
          for idx in range(g*3,min(g*3+3,len(clips))):
            clip_id,name=clips[idx]
            subprocess.run([
              "npx","remotion","render","src/index.jsx","Timothy3Clip","out/"+name,
              "--props="+json.dumps({"clipId":clip_id}),
              "--codec=h264","--crf=18","--pixel-format=yuv420p","--concurrency=2"
            ],check=True)
          PY

      - name: Validate
        run: |
          for f in remotion/out/*.mp4; do
            test -s "$f"
            ffprobe -v error -select_streams v:0 -show_entries stream=width,height,r_frame_rate -show_entries format=duration -of default=nw=1 "$f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: timothy3-remotion-group-${{ matrix.group }}
          path: remotion/out/*.mp4
          compression-level: 0
          retention-days: 1
